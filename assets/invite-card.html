<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ゆきかきリンク 招待カード</title>
<style>
  /* 印刷・スクショ用の招待カード（幅1000px・高さ自動） */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    background: #eaf4fb;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .card {
    width: 1000px; min-height: 1400px;
    background: #ffffff;
    padding: 54px 64px 46px;
    display: flex; flex-direction: column; align-items: center;
    background-image:
      radial-gradient(circle at 10% 6%, rgba(43,108,176,.10) 0 6px, transparent 7px),
      radial-gradient(circle at 88% 12%, rgba(43,108,176,.08) 0 4px, transparent 5px),
      radial-gradient(circle at 20% 92%, rgba(43,108,176,.08) 0 5px, transparent 6px),
      radial-gradient(circle at 80% 88%, rgba(43,108,176,.10) 0 6px, transparent 7px);
  }
  .badge {
    background: #2b6cb0; color: #fff;
    font-size: 30px; font-weight: 700;
    padding: 12px 40px; border-radius: 999px;
    letter-spacing: .12em;
  }
  h1 {
    font-size: 92px; color: #1c2b3a; margin-top: 30px;
    letter-spacing: .04em; line-height: 1.15;
  }
  h1 .yuki { color: #2b6cb0; }
  .sub {
    font-size: 40px; color: #51677c; margin-top: 14px;
    font-weight: 600;
  }
  .qrwrap {
    margin-top: 36px;
    border: 6px solid #d7e9f7; border-radius: 32px;
    padding: 24px; background: #fff;
  }
  .qrwrap img { width: 520px; height: 520px; display: block; image-rendering: pixelated; }
  .qrurl {
    margin-top: 16px; font-size: 24px; color: #51677c;
    font-family: ui-monospace, "Noto Sans Mono", monospace;
    word-break: break-all; text-align: center;
  }
  .steps {
    margin-top: 40px; width: 100%;
    display: flex; flex-direction: column; gap: 18px;
  }
  .step {
    display: flex; align-items: center; gap: 26px;
    background: #f4f9fc; border: 3px solid #d7e9f7; border-radius: 24px;
    padding: 20px 30px;
  }
  .step .n {
    flex: 0 0 82px; height: 82px; border-radius: 50%;
    background: #f59e0b; color: #1c2b3a; font-size: 46px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .step p { font-size: 40px; color: #1c2b3a; line-height: 1.3; font-weight: 600; }
  .note {
    margin-top: 36px; padding-top: 0; text-align: center;
    font-size: 30px; color: #51677c; line-height: 1.65;
  }
  .note b { color: #1c2b3a; font-size: 34px; }
  .foot {
    margin-top: 30px; font-size: 24px; color: #8aa2b8;
    display: flex; gap: 22px; align-items: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">まちの 助けあいアプリ</div>
    <h1><span class="yuki">ゆき</span>かきリンク</h1>
    <div class="sub">ご近所の 雪かき、おたがいさま。</div>

    <div class="qrwrap">
      <img src="./qr-invite.png" alt="ゆきかきリンクのQRコード">
    </div>
    <div class="qrurl">maebahesioru.github.io/yukikaki-link/</div>

    <div class="steps">
      <div class="step"><div class="n">1</div><p>スマホの カメラで<br>QRコードを よみとる</p></div>
      <div class="step"><div class="n">2</div><p>「雪かきを たのむ」か<br>「手伝いたい」を えらぶ</p></div>
      <div class="step"><div class="n">3</div><p>近所の人と マッチしたら<br>ありがとうを おくる</p></div>
    </div>

    <div class="note">
      <b>アカウントも おかねも いりません。</b><br>
      むずかしい そうさは ありません。<br>
      こまったら、となり近所で 教えあいましょう。
    </div>
    <div class="foot"><span>🍊 みかん</span><span>|</span><span>Neighborhood Hacks 2026</span></div>
  </div>
</body>
</html>
